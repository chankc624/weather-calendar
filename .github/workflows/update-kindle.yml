name: Update Kindle Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: kindle-dashboard-update
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install 'Pillow>=10,<13'
      - name: Generate Kindle PNG
        run: python generate_kindle.py
      - name: Publish image if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kindle/dashboard.png
          if ! git diff --cached --quiet; then
            git commit -m 'Update Kindle dashboard image'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
