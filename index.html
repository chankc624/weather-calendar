<style>
:root{color-scheme:dark;--gold:#ffd46c;--glass:rgba(11,20,35,.69)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;color:#fff;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}#photos,.shade{position:fixed;inset:0}#photos img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;transition:opacity 1.6s ease;transform:scale(1.015)}#photos img.active{opacity:1}.shade{background:linear-gradient(90deg,rgba(0,0,0,.27),transparent 53%,rgba(0,0,0,.16));pointer-events:none}.app{position:relative;width:100%;height:100%;transition:opacity .35s,transform 8s linear}.app.hidden{opacity:0;pointer-events:none}.clock{position:absolute;left:5%;bottom:6%;text-shadow:0 2px 12px #0009}.clock-time{font-size:clamp(72px,8.3vw,132px);font-weight:250;letter-spacing:1px;line-height:1}.date{font-size:clamp(20px,2.1vw,31px);margin-top:12px;font-weight:500}.lunar{font-size:clamp(15px,1.5vw,22px);opacity:.9;margin-top:6px}.sidebar{position:absolute;right:2.2%;top:4%;bottom:4%;width:clamp(340px,29%,470px);display:flex;flex-direction:column;gap:12px;overflow:auto;scrollbar-width:none}.sidebar::-webkit-scrollbar{display:none}.card{background:var(--glass);border:1px solid #ffffff24;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-radius:20px;padding:16px 19px;box-shadow:0 6px 20px #0002}.heading{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;margin-bottom:10px}.muted{font-size:12px;opacity:.72}.weather-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}.weather-emoji{font-size:50px}.temp{font-size:50px;font-weight:300;line-height:1}.desc{font-size:14px;opacity:.88;margin-top:5px}.weather-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 15px;font-size:14px}.metric{display:flex;justify-content:space-between;gap:8px}.metric span:first-child{opacity:.73}.forecast{border-top:1px solid #ffffff26;margin-top:13px;padding-top:10px;display:grid;gap:6px}.forecast-row{display:grid;grid-template-columns:1fr 35px 1fr;align-items:center;font-size:14px}.forecast-row span:last-child{text-align:right}.events{display:grid;gap:8px}.event{display:flex;justify-content:space-between;align-items:center;font-size:15px}.event strong{color:var(--gold);font-size:16px}.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;font-size:17px;font-weight:600}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}.week{font-size:13px;opacity:.72;margin-bottom:8px}.days{gap:4px}.day{font-size:14px;min-height:29px;display:grid;place-items:center;border-radius:9px}.day.other{opacity:.32}.day.today{background:var(--gold);color:#222;font-weight:800}.tip{position:absolute;bottom:1.8%;right:4%;font-size:11px;opacity:.65;transition:opacity .8s}.tip.hide{opacity:0}.night .shade{background:rgba(0,0,0,.34)}.night .app{filter:brightness(.8)}.deep-night .shade{background:rgba(0,0,0,.67)}.deep-night .app{filter:brightness(.5)}
@media(max-height:700px){.sidebar{top:2%;bottom:2%;gap:8px}.card{padding:10px 15px;border-radius:15px}.heading{margin-bottom:7px}.weather-top{margin-bottom:7px}.weather-emoji{font-size:39px}.temp{font-size:40px}.weather-grid,.forecast-row{font-size:12px}.forecast{margin-top:7px;padding-top:7px;gap:3px}.day{min-height:23px}.events{gap:5px}}
@media(max-width:760px){.sidebar{right:2%;width:44%;top:2%;bottom:2%;gap:7px}.card{padding:10px}.clock{left:3%;bottom:5%}.clock-time{font-size:clamp(52px,8vw,84px)}.date{font-size:15px}.lunar{font-size:12px}.weather-grid,.forecast-row,.event{font-size:11px}.temp{font-size:34px}.weather-emoji{font-size:32px}.heading{font-size:12px}.cal-header{font-size:12px}.day{font-size:11px;min-height:19px}.week{font-size:10px}.tip{display:none}}

    .region-badge{
      display:inline-flex;align-items:center;justify-content:center;

/* V2.6: compact additional information without changing the three-card layout */
.smg-warning{font-size:12px;line-height:1.35;padding:7px 9px;margin-bottom:7px;border-radius:9px;background:rgba(240,170,45,.14);border:1px solid rgba(255,214,120,.35)}.smg-warning a{color:#ffe19a;text-decoration:underline}.smg-warning.alert{background:rgba(200,45,40,.34);border-color:#ff7777}.rain-hint{font-size:12px;line-height:1.25;color:#fbe6a4;margin-top:7px;padding-top:6px;border-top:1px solid #ffffff26}

<body><div id="photos"></div><div class="shade"></div><main class="app" id="app"><section class="clock"><div class="clock-time" id="time">--:--</div><div class="date" id="date"></div><div class="lunar" id="lunar"></div></section><aside class="sidebar"><section class="card"><div class="heading"><span>🌤️ 澳門天氣</span><span class="muted" id="updated">載入中</span></div><div class="weather-top"><div class="weather-emoji" id="weather-icon">⛅</div><div><div class="temp" id="temp">--°</div><div class="desc" id="description">正在取得天氣…</div></div></div><div class="weather-grid"><div class="metric"><span>最高</span><span id="high">--</span></div><div class="metric"><span>最低</span><span id="low">--</span></div><div class="metric"><span>濕度</span><span id="humidity">--</span></div><div class="metric"><span>風速</span><span id="wind">--</span></div><div class="metric"><span>紫外線</span><span id="uv">--</span></div><div class="metric"><span>體感</span><span id="feels">--</span></div></div><div class="forecast" id="forecast"></div><div class="smg-warning" id="smg-warning">⚠️ 氣象局警告：查詢中…</div><div class="rain-hint" id="rain-hint">☂️ 降雨預報載入中</div></section><section class="card"><div class="heading"><span>📅 重要日子</span><span class="muted">最近 3 項</span></div><div class="events" id="events"></div><div class="agenda" id="agenda"></div></section><section class="card"><div class="cal-header"><span id="month"></span><span class="muted">今日高亮</span></div><div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="days" id="days"></div></section></aside><div class="tip" id="tip">點一下空白位置可隱藏資訊 · V2.6</div></main>
<script>
'use strict';
const APP_VERSION='2.6';
const CFG={timezone:'Asia/Macau',photoInterval:15000,photoFocus:[
// 每張相的焦點（水平%, 垂直%）；可按實際相片調整，避免人物被裁切
'48% 50%','50% 50%','50% 50%','50% 50%','50% 50%','50% 50%','50% 50%','50% 50%'
],weatherInterval:30*60*1000,photos:[
'https://i.postimg.cc/FYGz2Pm6/pic1.jpg','https://i.postimg.cc/18MXLWP7/pic2.jpg','https://i.postimg.cc/3k9NPL7t/pic3.jpg','https://i.postimg.cc/hXMvHCgp/pic4.jpg','https://i.postimg.cc/fVMkq44C/pic5.jpg','https://i.postimg.cc/ZWJ0skkx/pic6.jpg','https://i.postimg.cc/cvd6kqqm/pic7.jpg','https://i.postimg.cc/MnzX3kkt/pic8.jpg'],
// 可自行加入家庭生日、旅行、學校活動；日期用 YYYY-MM-DD
// 每年自動重複：MM-DD；加入家人生日、結婚紀念日可直接加一行
annualEvents:[
 {monthDay:'11-25',name:'Charlotte 生日',region:'家'}
],
// 學校／家庭行程：確認日期後填入；未填不會顯示虛構活動
// 例子：{date:'2026-11-06',name:'MAC 學校活動',region:'家'}
familyAgenda:[],
// 單次重要日子，例子：{date:'2026-12-25',name:'家庭旅行',region:'家'}
specialDays:[]};
const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');
const partsFmt=new Intl.DateTimeFormat('en-GB',{timeZone:CFG.timezone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function nowParts(){const p=Object.fromEntries(partsFmt.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,Number(x.value)]));return p;}
function iso(p){return `${p.year}-${pad(p.month)}-${pad(p.day)}`;}
function dateAtNoon(s){return new Date(`${s}T12:00:00+08:00`)}
const weekday=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const chineseNums=['','一','二','三','四','五','六','七','八','九','十','十一','十二'];
function lunarText(date){try{const fmt=new Intl.DateTimeFormat('zh-Hant-u-ca-chinese',{timeZone:CFG.timezone,year:'numeric',month:'long',day:'numeric'});const parts=fmt.formatToParts(date);const month=parts.find(x=>x.type==='month')?.value||'';const day=parts.find(x=>x.type==='day')?.value||'';const year=new Intl.DateTimeFormat('zh-Hant-u-ca-chinese',{timeZone:CFG.timezone,year:'numeric'}).formatToParts(date).find(x=>x.type==='relatedYear')?.value;const stems='甲乙丙丁戊己庚辛壬癸',branches='子丑寅卯辰巳午未申酉戌亥';const y=Number(year);const cyc=Number.isFinite(y)?stems[(y-4)%10]+branches[(y-4)%12]+'年 ':'';
let mm=month,dd=day;const numMonth=month.match(/(?:M)?(\d{1,2})(L)?/i);if(numMonth){const n=Number(numMonth[1]);if(n>=1&&n<=12)mm=(numMonth[2]?'閏':'')+chineseNums[n]+'月';}if(/^\d+$/.test(day)){const n=Number(day);if(n===10)dd='初十';else if(n===20)dd='二十';else if(n===30)dd='三十';else if(n<10)dd='初'+'一二三四五六七八九'[n-1];else if(n<20)dd='十'+'一二三四五六七八九'[n-11];else dd='廿'+'一二三四五六七八九'[n-21];}return `農曆 ${cyc}${mm}${dd}`;}catch{return '農曆日期暫不可用';}}
let lastDay='';function updateClock(){const p=nowParts();let h=p.hour%12||12;$('time').textContent=`${pad(h)}:${pad(p.minute)}`;const today=iso(p);if(today!==lastDay){lastDay=today;const day=dateAtNoon(today);$('date').textContent=`${p.year}年${pad(p.month)}月${pad(p.day)}日 ${weekday[day.getDay()]}`;$('lunar').textContent=lunarText(day);renderCalendar(p);renderEvents(today);renderAgenda(today);}const hour=p.hour;document.body.classList.toggle('night',hour>=20||hour<7);document.body.classList.toggle('deep-night',hour>=23||hour<6)}
function renderCalendar(p){$('month').textContent=`${p.year}年${p.month}月`;const first=new Date(Date.UTC(p.year,p.month-1,1)).getUTCDay();const count=new Date(Date.UTC(p.year,p.month,0)).getUTCDate();const prev=new Date(Date.UTC(p.year,p.month-1,0)).getUTCDate();const cells=Math.ceil((first+count)/7)*7;let out='';for(let i=0;i<cells;i++){const d=i-first+1;const other=d<1||d>count;const n=d<1?prev+d:d>count?d-count:d;out+=`<div class="day${other?' other':''}${!other&&d===p.day?' today':''}">${n}</div>`}$('days').innerHTML=out;scheduleSidebarFit();}
function holidayEvents(year){
  const holidays={
    2026:[
      // 澳門特區政府 2026 公眾假期
      ['2026-01-01','元旦','澳'],
      ['2026-02-17','農曆正月初一','澳'],['2026-02-18','農曆正月初二','澳'],['2026-02-19','農曆正月初三','澳'],
      ['2026-04-03','耶穌受難日','澳'],['2026-04-04','復活節前日','澳'],['2026-04-05','清明節','澳'],
      ['2026-05-01','勞動節','澳'],['2026-05-24','佛誕節','澳'],['2026-06-19','端午節','澳'],
      ['2026-09-26','中秋節翌日','澳'],['2026-10-01','國慶日','澳'],['2026-10-02','國慶日翌日','澳'],
      ['2026-10-18','重陽節','澳'],['2026-11-02','追思節','澳'],['2026-12-08','聖母無原罪瞻禮','澳'],
      ['2026-12-20','澳門特區成立紀念日','澳'],['2026-12-22','冬至','澳'],['2026-12-24','聖誕節前日','澳'],['2026-12-25','聖誕節','澳'],

      // 香港政府 2026 公眾假期
      ['2026-01-01','一月一日','港'],
      ['2026-02-17','農曆年初一','港'],['2026-02-18','農曆年初二','港'],['2026-02-19','農曆年初三','港'],
      ['2026-04-03','耶穌受難節','港'],['2026-04-04','耶穌受難節翌日','港'],
      ['2026-04-06','清明節翌日','港'],['2026-04-07','復活節星期一翌日','港'],
      ['2026-05-01','勞動節','港'],['2026-05-25','佛誕翌日','港'],['2026-06-19','端午節','港'],
      ['2026-07-01','香港特區成立紀念日','港'],['2026-09-26','中秋節翌日','港'],
      ['2026-10-01','國慶日','港'],['2026-10-19','重陽節翌日','港'],
      ['2026-12-25','聖誕節','港'],['2026-12-26','聖誕節後第一個周日','港']
    ],
    2027:[
      // 澳門特區政府 2027 年公眾假期（不包括僅公務員補假）
      ['2027-01-01','元旦','澳'],['2027-02-06','農曆正月初一','澳'],['2027-02-07','農曆正月初二','澳'],['2027-02-08','農曆正月初三','澳'],
      ['2027-03-26','耶穌受難日','澳'],['2027-03-27','復活節前日','澳'],['2027-04-05','清明節','澳'],
      ['2027-05-01','勞動節','澳'],['2027-05-13','佛誕節','澳'],['2027-06-09','端午節','澳'],
      ['2027-09-16','中秋節翌日','澳'],['2027-10-01','國慶日','澳'],['2027-10-02','國慶日翌日','澳'],
      ['2027-10-08','重陽節','澳'],['2027-11-02','追思節','澳'],['2027-12-08','聖母無原罪瞻禮','澳'],
      ['2027-12-20','澳門特區成立紀念日','澳'],['2027-12-22','冬至','澳'],['2027-12-24','聖誕節前日','澳'],['2027-12-25','聖誕節','澳'],
      // 香港政府 2027 年刊憲公眾假期
      ['2027-01-01','一月一日','港'],['2027-02-06','農曆年初一','港'],['2027-02-08','農曆年初三','港'],['2027-02-09','農曆年初四','港'],
      ['2027-03-26','耶穌受難節','港'],['2027-03-27','耶穌受難節翌日','港'],['2027-03-29','復活節星期一','港'],['2027-04-05','清明節','港'],
      ['2027-05-01','勞動節','港'],['2027-05-13','佛誕','港'],['2027-06-09','端午節','港'],['2027-07-01','香港特區成立紀念日','港'],
      ['2027-09-16','中秋節翌日','港'],['2027-10-01','國慶日','港'],['2027-10-08','重陽節','港'],
      ['2027-12-25','聖誕節','港'],['2027-12-27','聖誕節後首個周日','港']
    ]
  };
  return (holidays[year]||[]).map(([date,name,region])=>({date,name,region}));
}

function annualEventsFor(year){return CFG.annualEvents.map(e=>({date:`${year}-${e.monthDay}`,name:e.name,region:e.region||'家'}));}
function renderAgenda(today){
 const start=Date.parse(today+'T00:00:00Z');
 const list=CFG.familyAgenda.map(e=>({...e,days:Math.round((Date.parse(e.date+'T00:00:00Z')-start)/86400000)})).filter(e=>Number.isFinite(e.days)&&e.days>=0&&e.days<=7).sort((a,b)=>a.days-b.days).slice(0,2);
 const box=$('agenda');box.innerHTML=list.length?'<div class="agenda-title">🏠 未來 7 日行程</div>'+list.map(e=>`<div class="agenda-row"><span>${escapeHtml(e.name)}</span><b>${e.days===0?'今日':e.days===1?'明日':e.days+'日後'}</b></div>`).join(''):'';
 scheduleSidebarFit();
}

function renderEvents(today){const year=Number(today.slice(0,4));const map=new Map();for(const e of [...holidayEvents(year),...holidayEvents(year+1),...CFG.specialDays,...annualEventsFor(year),...annualEventsFor(year+1)])map.set(`${e.date}|${e.name}|${e.region||''}`,e);const todayMs=Date.parse(today+'T00:00:00Z');const items=[...map.values()].map(e=>({...e,days:Math.round((Date.parse(e.date+'T00:00:00Z')-todayMs)/86400000)})).filter(e=>e.days>=0).sort((a,b)=>a.days-b.days||String(a.region).localeCompare(String(b.region))).slice(0,3);$('events').innerHTML=items.length?items.map(e=>`<div class="event"><span>${e.region?`<small class="region-badge ${e.region==='澳'?'region-mo':e.region==='港'?'region-hk':'region-home'}">${escapeHtml(e.region)}</small>`:''}${escapeHtml(e.name)}</span><strong>${e.days===0?'今日':e.days+' 日'}</strong></div>`).join(''):'<div class="muted">暫無即將到來的重要日子</div>';}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function weatherIcon(code){if(code===0)return '☀️';if(code<=3)return '⛅';if(code===45||code===48)return '🌫️';if([51,53,55,56,57].includes(code))return '🌦️';if([61,63,65,66,67,80,81,82].includes(code))return '🌧️';if([71,73,75,77,85,86].includes(code))return '❄️';if(code>=95)return '⛈️';return '⛅';}
function weatherName(code){if(code===0)return '晴朗';if(code<=3)return '多雲';if(code===45||code===48)return '有霧';if(code>=95)return '雷暴';if(code>=71&&code<=86)return '雨雪';if(code>=51&&code<=82)return '有雨';return '天氣變化';}
async function fetchWeather(){const p=nowParts();const ctrl=new AbortController();const timeout=setTimeout(()=>ctrl.abort(),12000);try{const url='https://api.open-meteo.com/v1/forecast?latitude=22.1987&longitude=113.5439&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,uv_index,weather_code&hourly=precipitation_probability,precipitation&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Asia%2FMacau&forecast_days=5';const res=await fetch(url,{signal:ctrl.signal,cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json(),c=data.current,d=data.daily;const val=(n,suffix='')=>Number.isFinite(n)?Math.round(n)+suffix:'--';$('weather-icon').textContent=weatherIcon(c.weather_code);$('temp').textContent=val(c.temperature_2m,'°');$('description').textContent=`${weatherName(c.weather_code)} · 今日 ${val(d.temperature_2m_min[0])}–${val(d.temperature_2m_max[0],'°')}`;$('high').textContent=val(d.temperature_2m_max[0],'°');$('low').textContent=val(d.temperature_2m_min[0],'°');$('humidity').textContent=val(c.relative_humidity_2m,'%');$('wind').textContent=val(c.wind_speed_10m,' km/h');$('uv').textContent=val(c.uv_index);$('feels').textContent=val(c.apparent_temperature,'°');$('forecast').innerHTML=d.time.slice(0,4).map((s,i)=>{const weekdayShort=['日','一','二','三','四','五','六'][dateAtNoon(s).getDay()];return `<div class="forecast-row"><span>${i===0?'今日':i===1?'明日':'週'+weekdayShort}</span><span>${weatherIcon(d.weather_code[i])}</span><span>${val(d.temperature_2m_min[i])}° – ${val(d.temperature_2m_max[i])}°</span></div>`}).join('');renderRainHint(data,p);$('updated').textContent=`🟢 ${pad(p.hour)}:${pad(p.minute)} 更新`;}catch(e){$('updated').textContent='⚠️ 暫時離線';$('description').textContent='天氣更新失敗，稍後重試';$('rain-hint').textContent='☂️ 降雨預報暫不可用';}finally{clearTimeout(timeout);scheduleSidebarFit()}}
function initPhotos(){const stage=$('photos');CFG.photos.forEach((src,i)=>{const img=document.createElement('img');img.src=src;img.alt='家庭相片';img.className=i===0?'active':'';img.loading=i<2?'eager':'lazy';img.style.objectPosition=CFG.photoFocus[i]||'50% 50%';stage.appendChild(img)});let index=0;setInterval(()=>{const imgs=stage.querySelectorAll('img');if(!imgs.length)return;imgs[index].classList.remove('active');index=(index+1)%imgs.length;imgs[index].classList.add('active');},CFG.photoInterval)}


// Open-Meteo hourly forecast is NOT a minute-by-minute rain radar.
function renderRainHint(data,p){
 const hourly=data.hourly||{};const times=hourly.time||[],probs=hourly.precipitation_probability||[],amounts=hourly.precipitation||[];
 const currentHour=`${iso(p)}T${pad(p.hour)}:00`;let i=times.indexOf(currentHour);
 if(i<0){$('rain-hint').textContent='☂️ 兩小時降雨預報暫不可用';return;}
 const a=probs.slice(i,Math.min(i+3,probs.length)).filter(Number.isFinite);
 const rain=amounts.slice(i,Math.min(i+3,amounts.length)).filter(Number.isFinite);
 if(!a.length){$('rain-hint').textContent='☂️ 兩小時降雨預報暫不可用';return;}
 const max=Math.max(...a);const mm=rain.length?Math.max(...rain):0;
 $('rain-hint').textContent=max>=65||mm>=1?'☔ 未來約 2 小時有較高降雨機會（最高 '+max+'%）':max>=35?'🌦️ 未來約 2 小時有降雨機會（最高 '+max+'%）':'☂️ 未來約 2 小時降雨機會偏低（最高 '+max+'%）';
}
// Official SMG RSS may block cross-origin browser requests (CORS).
// NEVER interpret a failed request as "no active warnings".
async function fetchSmgWarnings(){
 const el=$('smg-warning');
 const official='https://www.smg.gov.mo/';
 const fallback=()=>{el.classList.remove('alert');el.innerHTML='⚠️ 氣象局警告未能自動核實 · <a href="'+official+'" target="_blank" rel="noopener noreferrer">查看官方警告</a>';scheduleSidebarFit();};
 const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),9000);
 try{
  const res=await fetch('https://rss.smg.gov.mo/e_WSignal_rss.xml',{signal:ctrl.signal,cache:'no-store'});
  if(!res.ok)throw new Error('SMG RSS HTTP '+res.status);
  const xml=new DOMParser().parseFromString(await res.text(),'application/xml');
  if(xml.querySelector('parsererror'))throw new Error('Invalid RSS');
  const items=[...xml.querySelectorAll('item')];
  // RSS entries may be historic. Without an official active-state field,
  // avoid presenting old headlines as live active warnings.
  el.classList.remove('alert');
  el.innerHTML='⚠️ 氣象局警告資訊 · <a href="'+official+'" target="_blank" rel="noopener noreferrer">按此核實最新生效訊號</a>';
 }catch(e){fallback();}finally{clearTimeout(timer);scheduleSidebarFit();}
}

// Check the deployed index.html every 6 hours. Reload only on an actual version change.
// This cannot override an intermediary that ignores cache directives; versioned URL helps.
async function checkForUpdate(){
 try{const r=await fetch('./index.html?version_check='+Date.now(),{cache:'no-store'});if(!r.ok)return;
 const html=await r.text();const match=html.match(/<meta name="dashboard-version" content="([^"]+)"/);
 if(match&&match[1]!==APP_VERSION){const u=new URL(location.href);u.searchParams.set('v',match[1]);location.replace(u.toString());}
 }catch(e){}
}

// V2.5: if a tablet's effective viewport is shorter than expected, shrink the
// entire right-hand panel just enough to show all calendar weeks without scroll.
let fitQueued=false;
function fitSidebar(){
  const side=document.querySelector('.sidebar');
  if(!side)return;
  side.style.transform='none';
  side.style.width='';
  const styles=getComputedStyle(side);
  const gap=parseFloat(styles.rowGap)||0;
  const cards=[...side.children];
  const contentHeight=cards.reduce((sum,card)=>sum+card.getBoundingClientRect().height,0)+gap*Math.max(0,cards.length-1);
  const top=side.getBoundingClientRect().top;
  const available=Math.max(200,window.innerHeight-top-Math.max(12,window.innerHeight*.025));
  const scale=Math.min(1,available/Math.max(1,contentHeight));
  if(scale<.999){
    // Preserve the sidebar's on-screen width when scaling the panel.
    const naturalWidth=side.getBoundingClientRect().width;
    side.style.width=`${naturalWidth/scale}px`;
    side.style.transform=`scale(${scale})`;
  }
}
function scheduleSidebarFit(){if(fitQueued)return;fitQueued=true;requestAnimationFrame(()=>{fitQueued=false;fitSidebar()})}
window.addEventListener('resize',scheduleSidebarFit);

initPhotos();updateClock();fetchWeather();fetchSmgWarnings();scheduleSidebarFit();setInterval(updateClock,1000);setInterval(fetchWeather,CFG.weatherInterval);setInterval(fetchSmgWarnings,10*60*1000);setTimeout(checkForUpdate,60000);setInterval(checkForUpdate,6*60*60*1000);setTimeout(()=>$('tip').classList.add('hide'),5000);document.addEventListener('click',e=>{if(e.target.closest('.sidebar'))return;$('app').classList.toggle('hidden')});document.addEventListener('visibilitychange',()=>{if(!document.hidden){updateClock();fetchWeather();fetchSmgWarnings();checkForUpdate();wake()}});async function wake(){try{if('wakeLock'in navigator)await navigator.wakeLock.request('screen')}catch{}}wake();setInterval(()=>{const x=(Math.random()-.5)*3,y=(Math.random()-.5)*3;$('app').style.transform=`translate(${x}px,${y}px)`},300000);
