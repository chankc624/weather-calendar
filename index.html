<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05070a">
<title>澳門家庭資訊屏 V2</title>
<style>
:root{--glass:rgba(8,12,18,.46);--glass2:rgba(8,12,18,.26);--line:rgba(255,255,255,.12);--muted:rgba(255,255,255,.72);--accent:#ffd166;--shadow:0 14px 45px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05070a;color:#fff;font-family:"PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}body{user-select:none}button{font:inherit}.photo-stage,.overlay{position:fixed;inset:0}.photo-stage{z-index:0;background:radial-gradient(circle at 30% 20%,#34495e,#0a0f16 65%)}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.02);transition:opacity 1.8s ease,transform 12s linear}.photo.active{opacity:1;transform:scale(1.06)}.overlay{z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.16) 0%,rgba(0,0,0,.08) 48%,rgba(0,0,0,.42) 100%),linear-gradient(0deg,rgba(0,0,0,.30),transparent 42%)}body.night .overlay{background:rgba(0,0,0,.50)}body.night{filter:brightness(.76)}
.dashboard{position:relative;z-index:2;width:100%;height:100%;transition:opacity .35s ease,transform 8s linear}.dashboard.hidden{opacity:0;pointer-events:none}.clock{position:absolute;left:clamp(28px,4vw,64px);bottom:clamp(28px,5vh,58px);text-shadow:0 3px 20px rgba(0,0,0,.72)}.time{font-size:clamp(72px,9vw,126px);font-weight:250;letter-spacing:.04em;line-height:.9;font-variant-numeric:tabular-nums}.date{font-size:clamp(18px,2vw,27px);margin-top:15px}.lunar{font-size:clamp(13px,1.25vw,17px);margin-top:7px;color:var(--muted)}
.panel{position:absolute;right:0;top:0;width:min(390px,34vw);height:100%;padding:20px 18px 24px;display:flex;flex-direction:column;gap:12px;overflow:auto;scrollbar-width:none;background:linear-gradient(90deg,transparent,rgba(5,8,12,.20));backdrop-filter:blur(10px)}.panel::-webkit-scrollbar{display:none}.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:15px 16px;box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.title{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:11px}.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7ee787;margin-right:6px}.status-dot.bad{background:#ff7b72}.weather-head{display:flex;align-items:center;gap:14px}.weather-icon{font-size:48px}.temp{font-size:42px;font-weight:280;line-height:1}.desc{font-size:13px;color:var(--muted);margin-top:4px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px 16px;margin-top:14px;font-size:12px}.metric{display:flex;justify-content:space-between}.metric span:first-child{color:var(--muted)}.forecast{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.forecast-row{display:grid;grid-template-columns:48px 30px 1fr;align-items:center;padding:3px 0;font-size:12px}.forecast-row span:last-child{text-align:right;color:var(--muted)}
.countdown{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px}.days{font-weight:650;color:var(--accent)}.calendar-head{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px}.week,.days-grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.week{font-size:10px;color:var(--muted);margin-bottom:5px}.days-grid{gap:3px;font-size:12px}.day{padding:5px 0;border-radius:8px}.day.other{opacity:.28}.day.today{background:var(--accent);color:#222;font-weight:700}.footer{font-size:10px;color:rgba(255,255,255,.5);text-align:center;padding:1px}.toast{position:fixed;z-index:20;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);padding:9px 14px;border-radius:999px;background:rgba(0,0,0,.62);backdrop-filter:blur(10px);font-size:12px;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:850px){.panel{width:42vw;min-width:320px}.time{font-size:68px}.clock{left:26px;bottom:30px}}@media(max-width:650px){.panel{width:100%;height:auto;max-height:55%;top:auto;bottom:0;padding:10px;display:grid;grid-template-columns:1fr 1fr;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent)}.panel .card{padding:11px}.clock{top:28px;bottom:auto}.time{font-size:58px}.date{font-size:16px;margin-top:8px}.lunar{font-size:12px}.weather-icon{font-size:34px}.temp{font-size:32px}.footer{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="photo-stage" id="photoStage"></div><div class="overlay"></div>
<main class="dashboard" id="dashboard">
<section class="clock"><div class="time" id="clockTime">--:--</div><div class="date" id="clockDate"></div><div class="lunar" id="clockLunar"></div></section>
<aside class="panel">
<section class="card"><div class="title"><span>🌤️ 澳門天氣</span><span id="weatherUpdate"><i class="status-dot"></i>更新中</span></div><div class="weather-head"><div class="weather-icon" id="weatherIcon">⛅</div><div><div class="temp" id="weatherTemp">--°</div><div class="desc" id="weatherDesc">正在取得天氣資料</div></div></div><div class="metrics"><div class="metric"><span>最高</span><b id="tempHigh">--°</b></div><div class="metric"><span>最低</span><b id="tempLow">--°</b></div><div class="metric"><span>濕度</span><b id="humidity">--%</b></div><div class="metric"><span>風速</span><b id="wind">--</b></div><div class="metric"><span>紫外線</span><b id="uv">--</b></div><div class="metric"><span>體感</span><b id="feels">--°</b></div></div><div class="forecast" id="forecastDays"></div></section>
<section class="card"><div class="title"><span>📅 重要日子</span><span>最近 3 項</span></div><div id="countdownList"></div></section>
<section class="card"><div class="calendar-head"><span id="calMonth"></span><span style="font-size:11px;color:var(--muted)">今日高亮</span></div><div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="days-grid" id="calDays"></div></section>
<div class="footer">點一下空白位置可隱藏資訊 · V2</div>
</aside></main><div class="toast" id="toast"></div>
<script>
'use strict';
const CFG={lat:22.1987,lon:113.5439,timezone:'Asia/Macau',photoMs:15000,weatherMs:30*60*1000,nightStart:20,nightEnd:7,photos:[
'https://i.postimg.cc/FYGz2Pm6/pic1.jpg','https://i.postimg.cc/18MXLWP7/pic2.jpg','https://i.postimg.cc/3k9NPL7t/pic3.jpg','https://i.postimg.cc/hXMvHCgp/pic4.jpg','https://i.postimg.cc/fVMkq44C/pic5.jpg','https://i.postimg.cc/ZWJ0skkx/pic6.jpg','https://i.postimg.cc/cvd6kqqm/pic7.jpg','https://i.postimg.cc/MnzX3kkt/pic8.jpg']};
const EVENTS=[
{date:'2026-10-18',name:'重陽節'},{date:'2026-12-20',name:'澳門回歸紀念日'},{date:'2026-12-22',name:'冬至'},{date:'2026-12-25',name:'聖誕節'},{date:'2027-01-01',name:'元旦'},{date:'2027-05-01',name:'勞動節'}];
const $=id=>document.getElementById(id); const pad=n=>String(n).padStart(2,'0');
function macauNow(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:CFG.timezone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const o=Object.fromEntries(parts.map(x=>[x.type,x.value]));return new Date(`${o.year}-${o.month}-${o.day}T${o.hour}:${o.minute}:${o.second}`)}
function updateClock(){const n=macauNow(),h=n.getHours()%12||12;$('clockTime').textContent=`${pad(h)}:${pad(n.getMinutes())}`;const wk=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];$('clockDate').textContent=`${n.getFullYear()}年${pad(n.getMonth()+1)}月${pad(n.getDate())}日 ${wk[n.getDay()]}`;updateLunar(n);document.body.classList.toggle('night',n.getHours()>=CFG.nightStart||n.getHours()<CFG.nightEnd)}
function updateLunar(d){try{const f=new Intl.DateTimeFormat('zh-Hant-u-ca-chinese',{timeZone:CFG.timezone,year:'numeric',month:'long',day:'numeric'});$('clockLunar').textContent='農曆 '+f.format(d)}catch{$('clockLunar').textContent='澳門時間 · Asia/Macau'}}
function weatherInfo(c){if(c===0)return['☀️','晴'];if([1,2].includes(c))return['🌤️','大致天晴'];if(c===3)return['☁️','多雲'];if([45,48].includes(c))return['🌫️','有霧'];if([51,53,55,56,57].includes(c))return['🌦️','毛毛雨'];if([61,63,65,66,67,80,81,82].includes(c))return['🌧️','有雨'];if([71,73,75,77,85,86].includes(c))return['🌨️','降雪'];if([95,96,99].includes(c))return['⛈️','雷暴'];return['⛅','天氣變化']}
async function fetchWeather(){const url=`https://api.open-meteo.com/v1/forecast?latitude=${CFG.lat}&longitude=${CFG.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,uv_index,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=${encodeURIComponent(CFG.timezone)}&forecast_days=7`;try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json(),c=d.current,x=d.daily,[icon,desc]=weatherInfo(c.weather_code);$('weatherIcon').textContent=icon;$('weatherTemp').textContent=Math.round(c.temperature_2m)+'°';$('weatherDesc').textContent=desc+' · 今日 '+Math.round(x.temperature_2m_min[0])+'–'+Math.round(x.temperature_2m_max[0])+'°';$('tempHigh').textContent=Math.round(x.temperature_2m_max[0])+'°';$('tempLow').textContent=Math.round(x.temperature_2m_min[0])+'°';$('humidity').textContent=Math.round(c.relative_humidity_2m)+'%';$('wind').textContent=Math.round(c.wind_speed_10m)+' km/h';$('uv').textContent=Math.round(c.uv_index);$('feels').textContent=Math.round(c.apparent_temperature)+'°';$('forecastDays').innerHTML=x.time.slice(0,4).map((t,i)=>{const q=weatherInfo(x.weather_code[i])[0],label=i===0?'今日':i===1?'明日':'週'+['日','一','二','三','四','五','六'][new Date(t+'T12:00').getDay()];return `<div class="forecast-row"><span>${label}</span><span>${q}</span><span>${Math.round(x.temperature_2m_min[i])}° – ${Math.round(x.temperature_2m_max[i])}°</span></div>`}).join('');const n=macauNow();$('weatherUpdate').innerHTML=`<i class="status-dot"></i>${pad(n.getHours())}:${pad(n.getMinutes())} 更新`;localStorage.setItem('weatherV2',JSON.stringify({at:Date.now(),d}))}catch(e){$('weatherUpdate').innerHTML='<i class="status-dot bad"></i>離線';$('weatherDesc').textContent='暫時無法更新天氣';console.warn('weather',e)}}
function renderCalendar(){const n=macauNow(),y=n.getFullYear(),m=n.getMonth(),today=n.getDate();$('calMonth').textContent=`${y}年${m+1}月`;const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();let a=[];for(let i=first-1;i>=0;i--)a.push(`<div class="day other">${prev-i}</div>`);for(let d=1;d<=days;d++)a.push(`<div class="day${d===today?' today':''}">${d}</div>`);for(let i=1;a.length<42;i++)a.push(`<div class="day other">${i}</div>`);$('calDays').innerHTML=a.join('')}
function renderCountdown(){const n=macauNow();n.setHours(0,0,0,0);const upcoming=EVENTS.map(e=>{const d=new Date(e.date+'T00:00:00');return{...e,diff:Math.round((d-n)/86400000)}}).filter(e=>e.diff>=0).sort((a,b)=>a.diff-b.diff).slice(0,3);$('countdownList').innerHTML=upcoming.length?upcoming.map(e=>`<div class="countdown"><span>${e.name}</span><span class="days">${e.diff===0?'今日':e.diff+' 日'}</span></div>`).join(''):'<div class="countdown" style="color:var(--muted)">暫無已設定日子</div>'}
let photoIndex=0;function initPhotos(){const s=$('photoStage');CFG.photos.forEach((src,i)=>{const img=new Image();img.className='photo'+(i===0?' active':'');img.alt='';img.decoding='async';img.src=src;img.onerror=()=>img.remove();s.appendChild(img)})}function nextPhoto(){const a=[...document.querySelectorAll('.photo')];if(a.length<2)return;photoIndex%=a.length;a[photoIndex].classList.remove('active');photoIndex=(photoIndex+1)%a.length;a[photoIndex].classList.add('active')}
let wakeLock=null;async function keepAwake(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch{}}document.addEventListener('visibilitychange',()=>{if(!document.hidden)keepAwake()});
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}document.body.addEventListener('click',e=>{if(e.target.closest('.panel'))return;$('dashboard').classList.toggle('hidden');toast($('dashboard').classList.contains('hidden')?'資訊已隱藏 · 再點一下顯示':'資訊已顯示')});
function burnInShift(){const x=(Math.random()-.5)*4,y=(Math.random()-.5)*4;$('dashboard').style.transform=`translate(${x}px,${y}px)`}
function dailyRefresh(){renderCalendar();renderCountdown()}
initPhotos();updateClock();renderCalendar();renderCountdown();fetchWeather();keepAwake();setInterval(updateClock,1000);setInterval(nextPhoto,CFG.photoMs);setInterval(fetchWeather,CFG.weatherMs);setInterval(burnInShift,5*60*1000);setInterval(dailyRefresh,60*60*1000);
</script>
</body></html>
